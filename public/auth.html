<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlanPass — Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <div class="logo">PP</div>
      <h1>PlanPass</h1>
      <p class="muted">Municipal Blueprint &amp; Code Compliance Examiner — reviewer sign-in (Neon Auth)</p>
      <form id="auth-form">
        <div style="background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.4); border-radius: 8px; padding: 12px; margin-bottom: 16px; text-align: left;">
          <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
            <strong style="color: #38bdf8; font-size: 13px;">🏆 Hackathon Judge Fast-Pass</strong>
            <span style="font-size: 11px; background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px;">Universal Access</span>
          </div>
          <p style="font-size: 12px; color: #94a3b8; margin: 0 0 10px 0;">Use pre-seeded judge credentials or click below for instant 1-click access:</p>
          <div style="font-family: monospace; font-size: 11px; color: #e2e8f0; background: #0f172a; padding: 8px; border-radius: 4px; margin-bottom: 10px;">
            <div><strong>Email:</strong> judge@hackathon.meta.ai</div>
            <div><strong>Password:</strong> MetaHackathon2026!</div>
          </div>
          <button id="judge-login-btn" type="button" style="width: 100%; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; font-weight: 600; padding: 10px; border-radius: 6px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <span>⚡</span> 1-Click Judge Sign-In
          </button>
        </div>

        <label>
          Email
          <input id="email" type="email" autocomplete="email" required />
        </label>
        <label>
          Password
          <input id="password" type="password" autocomplete="current-password" required minlength="8" />
        </label>
        <label>
          Display name (sign-up only)
          <input id="name" type="text" autocomplete="name" />
        </label>
        <div class="row">
          <button id="signin" type="submit" class="primary">Sign in</button>
          <button id="signup" type="button">Create account</button>
        </div>
        <p id="auth-error" role="alert"></p>
      </form>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
