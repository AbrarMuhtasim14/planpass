<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#0f172a; font-family:'Courier New', monospace;">
  <!-- Grid background -->
  <defs>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="800" fill="#0f172a"/>
  <rect width="1000" height="800" fill="url(#cadGrid)"/>

  <!-- Title Block & Header -->
  <rect x="30" y="25" width="940" height="45" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="4"/>
  <text x="50" y="53" fill="#10b981" font-size="16" font-weight="bold" letter-spacing="1.5">PLANPASS ARCHITECTURAL BENCHMARK #2: COMMERCIAL CAFE (COMPLIANT STATE)</text>
  <text x="820" y="53" fill="#94a3b8" font-size="12">SCALE: 24px = 1'-0"</text>

  <!-- External Building Perimeter Walls -->
  <rect x="60" y="100" width="880" height="620" fill="#020617" stroke="#f8fafc" stroke-width="6"/>

  <!-- Interior Wall: Main Dining / Kitchen Partition (Shifted right by 24px to expand corridor) -->
  <line x1="574" y1="100" x2="574" y2="480" stroke="#f8fafc" stroke-width="5"/>
  <line x1="574" y1="560" x2="574" y2="720" stroke="#f8fafc" stroke-width="5"/>

  <!-- Interior Wall: Restroom Enclosure with Dedicated Door Alcove -->
  <rect x="360" y="100" width="190" height="260" fill="#0b1329" stroke="#f8fafc" stroke-width="5"/>

  <!-- Restroom Fixtures -->
  <!-- Toilet with compliant grab bars -->
  <rect x="380" y="120" width="28" height="45" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="394" cy="150" r="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Grab bars (compliant ADA 604.5) -->
  <line x1="370" y1="120" x2="370" y2="175" stroke="#10b981" stroke-width="3"/>
  <line x1="370" y1="112" x2="415" y2="112" stroke="#10b981" stroke-width="3"/>
  <!-- Sink -->
  <rect x="475" y="115" width="45" height="30" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="497" cy="130" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Restroom 60" Turning Space (ADA 304.3 Requirement) - COMPLETELY UNOBSTRUCTED -->
  <circle cx="455" cy="245" r="60" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2"/>
  <text x="400" y="250" fill="#10b981" font-size="11" font-weight="bold">60" CLEAR TURNING SPACE</text>

  <!-- Restroom Door - Remediated to Outward Swing into Alcove -->
  <line x1="360" y1="360" x2="410" y2="360" stroke="#f8fafc" stroke-width="5"/>
  <line x1="480" y1="360" x2="550" y2="360" stroke="#f8fafc" stroke-width="5"/>
  <!-- Door leaf swinging OUTWARD into alcove -->
  <line x1="410" y1="360" x2="455" y2="425" stroke="#10b981" stroke-width="3.5"/>
  <!-- Outward swing arc -->
  <path d="M 480 360 A 70 70 0 0 1 455 425" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Compliance Callout Badge -->
  <rect x="360" y="435" width="200" height="28" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="370" y="453" fill="#6ee7b7" font-size="11" font-weight="bold">✓ ADA §604.3.2 COMPLIANT</text>

  <!-- Corridor Egress (COMPLIANT: 48" clear corridor width) -->
  <line x1="574" y1="360" x2="574" y2="560" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <!-- Dimension Line -->
  <line x1="365" y1="500" x2="565" y2="500" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="365" cy="500" r="3" fill="#10b981"/>
  <circle cx="565" cy="500" r="3" fill="#10b981"/>
  <text x="400" y="492" fill="#10b981" font-size="12" font-weight="bold">48" CLEAR (IBC REQ: 44")</text>

  <!-- Compliance Callout Badge -->
  <rect x="360" y="515" width="200" height="28" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="370" y="533" fill="#6ee7b7" font-size="11" font-weight="bold">✓ IBC §1020.2 COMPLIANT</text>

  <!-- Service Counter & Kitchen Zone -->
  <rect x="600" y="130" width="310" height="180" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="670" y="220" fill="#94a3b8" font-size="16" font-weight="bold">KITCHEN / PREP ZONE</text>

  <!-- Main Bar Counter -->
  <rect x="600" y="340" width="280" height="35" rx="3" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <text x="660" y="362" fill="#f8fafc" font-size="13" font-weight="bold">ORDER & PICKUP BAR</text>

  <!-- Dining Seating Area -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <!-- Tables -->
    <circle cx="160" cy="220" r="36"/>
    <circle cx="260" cy="220" r="36"/>
    <circle cx="160" cy="380" r="36"/>
    <circle cx="260" cy="380" r="36"/>
    <circle cx="160" cy="540" r="36"/>
    <circle cx="260" cy="540" r="36"/>
  </g>
  <text x="140" y="640" fill="#94a3b8" font-size="16" font-weight="bold">DINING ROOM (OCCUPANCY: 48)</text>

  <!-- Main Entry Door -->
  <line x1="60" y1="620" x2="60" y2="720" stroke="#f8fafc" stroke-width="6"/>
  <line x1="60" y1="520" x2="60" y2="520" stroke="#f8fafc" stroke-width="6"/>
  <line x1="60" y1="530" x2="15" y2="580" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M 60 610 A 80 80 0 0 1 15 580" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="75" y="575" fill="#38bdf8" font-size="12" font-weight="bold">MAIN EXIT (36" CLEAR)</text>

  <!-- Stamp / Inspection Status Box -->
  <rect x="680" y="600" width="230" height="95" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="4"/>
  <text x="700" y="630" fill="#34d399" font-size="14" font-weight="bold">STATUS: APPROVED FOR PE</text>
  <text x="700" y="655" fill="#a7f3d0" font-size="12">0 Outstanding Violations</text>
  <text x="700" y="675" fill="#94a3b8" font-size="11">PlanPass Score: 98 / 100</text>
</svg>
