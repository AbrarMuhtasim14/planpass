<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#0f172a; font-family:'Courier New', monospace;">
  <!-- Grid background -->
  <defs>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="800" fill="#0f172a"/>
  <rect width="1000" height="800" fill="url(#cadGrid)"/>

  <!-- Title Block & Header -->
  <rect x="30" y="25" width="940" height="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
  <text x="50" y="53" fill="#38bdf8" font-size="16" font-weight="bold" letter-spacing="1.5">PLANPASS ARCHITECTURAL BENCHMARK #1: COMMERCIAL CAFE (VIOLATION STATE)</text>
  <text x="820" y="53" fill="#94a3b8" font-size="12">SCALE: 24px = 1'-0"</text>

  <!-- External Building Perimeter Walls -->
  <rect x="60" y="100" width="880" height="620" fill="#020617" stroke="#f8fafc" stroke-width="6"/>

  <!-- Interior Wall: Main Dining / Kitchen Partition -->
  <line x1="550" y1="100" x2="550" y2="480" stroke="#f8fafc" stroke-width="5"/>
  <line x1="550" y1="560" x2="550" y2="720" stroke="#f8fafc" stroke-width="5"/>

  <!-- Interior Wall: Restroom Enclosure -->
  <!-- Restroom box at (400, 200) to (560, 380) roughly matching PRD coordinates -->
  <rect x="360" y="100" width="190" height="260" fill="#0b1329" stroke="#f8fafc" stroke-width="5"/>

  <!-- Restroom Fixtures -->
  <!-- Toilet -->
  <rect x="380" y="120" width="28" height="45" rx="8" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="394" cy="150" r="12" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Sink -->
  <rect x="475" y="115" width="45" height="30" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="497" cy="130" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Restroom 60" Turning Space (ADA 304.3 Requirement) - Represented as dashed circle -->
  <circle cx="455" cy="245" r="60" fill="rgba(239, 68, 68, 0.12)" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="405" y="250" fill="#ef4444" font-size="11" font-weight="bold">60" REQ. CIRCLE</text>

  <!-- Restroom Inward Swinging Door (VIOLATION: Inward swing sweeps into turning space) -->
  <!-- Door Opening at y=360, x=410 to 480 -->
  <line x1="360" y1="360" x2="410" y2="360" stroke="#f8fafc" stroke-width="5"/>
  <line x1="480" y1="360" x2="550" y2="360" stroke="#f8fafc" stroke-width="5"/>
  <!-- Door Leaf swinging inward into restroom -->
  <line x1="410" y1="360" x2="455" y2="295" stroke="#ef4444" stroke-width="3.5"/>
  <!-- Swing Arc (Overlaps turning space) -->
  <path d="M 480 360 A 70 70 0 0 0 455 295" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Violation Badge V-01 -->
  <rect x="375" y="380" width="180" height="32" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="385" y="401" fill="#fca5a5" font-size="11" font-weight="bold">⚠️ V-01: ADA §604.3.2</text>

  <!-- Corridor Egress (VIOLATION: Narrow Corridor between Restroom & Dining Partition) -->
  <!-- Width: 32" actual (required: 44" min for commercial assembly) -->
  <line x1="550" y1="360" x2="550" y2="560" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="360" y1="360" x2="360" y2="560" stroke="#f8fafc" stroke-width="4"/>
  <!-- Corridor Dimension Line -->
  <line x1="365" y1="460" x2="545" y2="460" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="365" cy="460" r="3" fill="#ef4444"/>
  <circle cx="545" cy="460" r="3" fill="#ef4444"/>
  <text x="405" y="452" fill="#ef4444" font-size="12" font-weight="bold">32" CLEAR (44" REQ)</text>
  
  <!-- Violation Badge V-02 -->
  <rect x="375" y="480" width="180" height="32" rx="4" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="385" y="501" fill="#fca5a5" font-size="11" font-weight="bold">⚠️ V-02: IBC §1020.2</text>

  <!-- Service Counter & Kitchen Zone -->
  <rect x="580" y="130" width="330" height="180" fill="#1e293b" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="670" y="220" fill="#94a3b8" font-size="16" font-weight="bold">KITCHEN / PREP ZONE</text>

  <!-- Main Bar Counter -->
  <rect x="580" y="340" width="280" height="35" rx="3" fill="#334155" stroke="#cbd5e1" stroke-width="2"/>
  <text x="650" y="362" fill="#f8fafc" font-size="13" font-weight="bold">ORDER & PICKUP BAR</text>

  <!-- Dining Seating Area -->
  <g fill="#1e293b" stroke="#64748b" stroke-width="2">
    <!-- Table 1 -->
    <circle cx="160" cy="220" r="36"/>
    <rect x="100" y="210" width="16" height="20" rx="3"/>
    <rect x="204" y="210" width="16" height="20" rx="3"/>
    <!-- Table 2 -->
    <circle cx="260" cy="220" r="36"/>
    <rect x="200" y="210" width="16" height="20" rx="3"/>
    <rect x="304" y="210" width="16" height="20" rx="3"/>
    <!-- Table 3 -->
    <circle cx="160" cy="380" r="36"/>
    <!-- Table 4 -->
    <circle cx="260" cy="380" r="36"/>
    <!-- Table 5 & 6 -->
    <circle cx="160" cy="540" r="36"/>
    <circle cx="260" cy="540" r="36"/>
  </g>
  <text x="140" y="640" fill="#94a3b8" font-size="16" font-weight="bold">DINING ROOM (OCCUPANCY: 48)</text>

  <!-- Main Entry Door (Exit to Public Way) -->
  <line x1="60" y1="620" x2="60" y2="720" stroke="#f8fafc" stroke-width="6"/>
  <line x1="60" y1="520" x2="60" y2="520" stroke="#f8fafc" stroke-width="6"/>
  <!-- 36" Entry Door Swing Outward -->
  <line x1="60" y1="530" x2="15" y2="580" stroke="#38bdf8" stroke-width="3.5"/>
  <path d="M 60 610 A 80 80 0 0 1 15 580" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="75" y="575" fill="#38bdf8" font-size="12" font-weight="bold">MAIN EXIT (36" CLEAR)</text>

  <!-- Stamp / Inspection Status Box -->
  <rect x="680" y="600" width="230" height="95" fill="#450a0a" stroke="#ef4444" stroke-width="2" rx="4"/>
  <text x="700" y="630" fill="#f87171" font-size="14" font-weight="bold">STATUS: HOLD / REJECTED</text>
  <text x="700" y="655" fill="#fca5a5" font-size="12">2 Critical Code Violations</text>
  <text x="700" y="675" fill="#94a3b8" font-size="11">PlanPass Score: 42 / 100</text>
</svg>
