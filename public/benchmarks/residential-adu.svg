<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" style="background:#0f172a; font-family:'Courier New', monospace;">
  <!-- Grid background -->
  <defs>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="800" fill="#0f172a"/>
  <rect width="1000" height="800" fill="url(#cadGrid)"/>

  <!-- Title Block & Header -->
  <rect x="30" y="25" width="940" height="45" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" rx="4"/>
  <text x="50" y="53" fill="#38bdf8" font-size="16" font-weight="bold" letter-spacing="1.5">PLANPASS ARCHITECTURAL BENCHMARK #3: RESIDENTIAL ADU (650 SQ FT)</text>
  <text x="820" y="53" fill="#94a3b8" font-size="12">SCALE: 24px = 1'-0"</text>

  <!-- External ADU Perimeter Walls -->
  <rect x="80" y="100" width="840" height="600" fill="#020617" stroke="#f8fafc" stroke-width="6"/>

  <!-- Interior Wall Partitioning Bedroom from Living Area -->
  <line x1="520" y1="100" x2="520" y2="460" stroke="#f8fafc" stroke-width="5"/>
  <line x1="520" y1="540" x2="520" y2="700" stroke="#f8fafc" stroke-width="5"/>

  <!-- Bedroom Zone (Left Side: 18' x 15') -->
  <rect x="120" y="140" width="160" height="200" fill="#1e293b" stroke="#64748b" stroke-width="2" rx="4"/>
  <!-- Bed & Pillows -->
  <rect x="135" y="150" width="60" height="30" fill="#334155" rx="3"/>
  <rect x="205" y="150" width="60" height="30" fill="#334155" rx="3"/>
  <text x="145" y="380" fill="#94a3b8" font-size="16" font-weight="bold">PRIMARY BEDROOM</text>
  <text x="145" y="405" fill="#64748b" font-size="12">14'-0" x 12'-6" (IRC MIN: 70 SF)</text>

  <!-- Bedroom Emergency Egress Window (IRC R310.1 compliant: min 5.7 sq ft clear opening) -->
  <rect x="80" y="220" width="8" height="90" fill="#38bdf8"/>
  <line x1="72" y1="220" x2="72" y2="310" stroke="#38bdf8" stroke-width="2"/>
  <text x="95" y="270" fill="#38bdf8" font-size="11" font-weight="bold">EGRESS WINDOW (IRC §R310)</text>

  <!-- Bathroom Enclosure (Bottom Left: 8' x 6') -->
  <rect x="80" y="480" width="280" height="220" fill="#0b1329" stroke="#f8fafc" stroke-width="5"/>
  <!-- Bathtub / Shower 30x60 -->
  <rect x="85" y="485" width="70" height="130" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="120" cy="550" r="8" fill="#334155"/>
  <!-- Toilet -->
  <rect x="200" y="490" width="30" height="45" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="215" cy="520" r="10" fill="#1e293b"/>
  <!-- Vanity Sink -->
  <rect x="280" y="490" width="55" height="35" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="307" cy="507" r="7" fill="#1e293b"/>
  <text x="180" y="660" fill="#94a3b8" font-size="14" font-weight="bold">FULL BATHROOM</text>

  <!-- Bathroom Door (32" Clear Opening) -->
  <line x1="360" y1="580" x2="360" y2="700" stroke="#f8fafc" stroke-width="5"/>
  <line x1="360" y1="580" x2="315" y2="540" stroke="#38bdf8" stroke-width="3"/>
  <path d="M 360 515 A 65 65 0 0 1 315 540" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Open Concept Living & Kitchenette (Right Side) -->
  <!-- Kitchen Counter L-shape -->
  <path d="M 525 105 L 820 105 L 820 170 L 610 170 L 610 260 L 525 260 Z" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="630" y="140" fill="#f8fafc" font-size="13" font-weight="bold">KITCHENETTE / RANGE / SINK</text>
  <!-- Kitchen Sink -->
  <rect x="670" y="112" width="60" height="35" rx="3" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="700" cy="130" r="6" fill="#0f172a"/>

  <!-- Living Room Sofa & Coffee Table -->
  <rect x="640" y="380" width="180" height="60" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="670" y="460" width="120" height="40" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <text x="670" y="540" fill="#94a3b8" font-size="16" font-weight="bold">LIVING / DINING SPACE</text>

  <!-- ADU Main Entry Door (36" Clear Width Exterior Exit) -->
  <line x1="920" y1="560" x2="920" y2="700" stroke="#f8fafc" stroke-width="6"/>
  <line x1="920" y1="460" x2="920" y2="460" stroke="#f8fafc" stroke-width="6"/>
  <!-- Door leaf swinging inward -->
  <line x1="920" y1="470" x2="855" y2="525" stroke="#10b981" stroke-width="3.5"/>
  <path d="M 920 550 A 80 80 0 0 1 855 525" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="760" y="590" fill="#10b981" font-size="12" font-weight="bold">MAIN ENTRY (36" CLEAR)</text>

  <!-- Smoke / Carbon Monoxide Detector -->
  <circle cx="520" cy="360" r="12" fill="#38bdf8" stroke="#f8fafc" stroke-width="1.5"/>
  <text x="540" y="365" fill="#38bdf8" font-size="11" font-weight="bold">SMOKE/CO (IRC §R314)</text>

  <!-- Permit Review Box -->
  <rect x="670" y="620" width="230" height="65" fill="#064e3b" stroke="#10b981" stroke-width="2" rx="4"/>
  <text x="690" y="645" fill="#34d399" font-size="13" font-weight="bold">RESIDENTIAL ADU PRE-CHECK</text>
  <text x="690" y="668" fill="#a7f3d0" font-size="11">✓ IRC Egress & Habitable Area OK</text>
</svg>
